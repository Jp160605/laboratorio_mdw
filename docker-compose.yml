services:
  postgres:
    image: postgres:16-alpine
    container_name: reservas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: reservas_db
      TZ: "America/Mexico_City"
      PGTZ: "America/Mexico_City"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    networks:
      - reservas-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservas_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: reservas_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "800mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - reservas-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 128M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reservas_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      TZ: "America/Mexico_City"
      FRONTEND_URL: "http://localhost:3000"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: reservas_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super_secret_jwt_universidad_reservas_2026
      JWT_EXPIRES_IN: 8h
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASS: "contrasena_o_app_password"
      SMTP_FROM: '"Sistema de Reservas" <notificaciones@universidad.edu>'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reservas-net
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 128M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reservas_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: "America/Mexico_City"
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    depends_on:
      - backend
    networks:
      - reservas-net
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 128M

networks:
  reservas-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
